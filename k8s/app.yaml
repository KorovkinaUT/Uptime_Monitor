apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-monitor
  namespace: uptime-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uptime-monitor
  template:
    metadata:
      labels:
        app: uptime-monitor
    spec:
      containers:
        - name: app
          image: uptime-monitor:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: uptime-monitor-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: uptime-monitor-db
                  key: DATABASE_URL
---
apiVersion: v1
kind: Service
metadata:
  name: uptime-monitor
  namespace: uptime-monitor
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: http
      nodePort: 30080
  selector:
    app: uptime-monitor
