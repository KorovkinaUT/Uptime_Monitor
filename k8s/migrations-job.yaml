apiVersion: batch/v1
kind: Job
metadata:
  name: uptime-monitor-migrate
  namespace: uptime-monitor
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: uptime-monitor-migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: uptime-monitor:local
          imagePullPolicy: Never
          command:
            - /bin/sh
            - -c
          args:
            - exec /app/migrate -path /app/migrations -database "$DATABASE_URL" up
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: uptime-monitor-db
                  key: DATABASE_URL
